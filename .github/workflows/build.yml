name: Build Spider-Man VPK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo layout
        run: |
          echo "--- top level ---"; ls -la
          echo "--- CMakeLists.txt files (depth 4) ---"; find . -maxdepth 4 -name CMakeLists.txt
      - name: Build and install kubridge stubs
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          export PATH=$VITASDK/bin:$PATH
          git clone --depth 1 https://github.com/TheOfficialFloW/kubridge /tmp/kubridge
          cd /tmp/kubridge
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release || true
          cmake --build build -j"$(nproc)" || true
          cmake --install build || true
          find /tmp/kubridge -name 'libkubridge_stub*.a' -exec cp -v {} $VITASDK/arm-vita-eabi/lib/ \;
          find /tmp/kubridge -name 'kubridge.h' -exec cp -v {} $VITASDK/arm-vita-eabi/include/ \;
          ls -la $VITASDK/arm-vita-eabi/lib | grep -i kubridge || echo "WARNING: no kubridge stub library found"
      - name: Build
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          export PATH=$VITASDK/bin:$PATH
          DIR=$(grep -l "project(spiderman_vita" $(find . -maxdepth 4 -name CMakeLists.txt) 2>/dev/null | head -1 | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "ERROR: could not find the spiderman_vita project (CMakeLists.txt with project(spiderman_vita)) in this repo."
            echo "Extract the zip and upload the spiderman_vita folder, with its src/ subfolder, to the repo."
            exit 1
          fi
          echo "Building in: $DIR"
          cd "$DIR" && cmake -B build && cmake --build build -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: spiderman_vita_vpk
          path: "**/build/spiderman_vita.vpk"
