name: Build Spider-Man VPK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and install kubridge stubs
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          export PATH=$VITASDK/bin:$PATH
          git clone --depth 1 https://github.com/TheOfficialFloW/kubridge /tmp/kubridge
          cd /tmp/kubridge
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release || true
          cmake --build build -j"$(nproc)" || true
          cmake --install build || true
          # fallback in case "install" does not place the stub/header where we need them
          find /tmp/kubridge -name 'libkubridge_stub*.a' -exec cp -v {} $VITASDK/arm-vita-eabi/lib/ \;
          find /tmp/kubridge -name 'kubridge.h' -exec cp -v {} $VITASDK/arm-vita-eabi/include/ \;
          ls -la $VITASDK/arm-vita-eabi/lib | grep -i kubridge || echo "WARNING: no kubridge stub library found"
      - name: Build
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          export PATH=$VITASDK/bin:$PATH
          cd spiderman_vita && cmake -B build && cmake --build build -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: spiderman_vita_vpk
          path: spiderman_vita/build/*.vpk
