name: Build VPK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vitaGL and its dependencies
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          export PATH=$VITASDK/bin:$PATH
          git clone --depth 1 https://github.com/vdpm/vdpm /tmp/vdpm
          cd /tmp/vdpm && ./bootstrap-vitasdk.sh >/dev/null 2>&1 || true
          ./install-all.sh >/dev/null 2>&1 || true
          if [ ! -f $VITASDK/arm-vita-eabi/lib/libvitaGL.a ]; then
            git clone --depth 1 https://github.com/Rinnegatamante/vitaGL /tmp/vitaGL
            make -C /tmp/vitaGL -j"$(nproc)" install
          fi
      - name: Fetch stb_image.h
        run: curl -L -o dbtap_vita_port_wip/vita/src/stb_image.h https://raw.githubusercontent.com/nothings/stb/master/stb_image.h
      - name: Build
        run: |
          export VITASDK=${VITASDK:-/usr/local/vitasdk}
          export PATH=$VITASDK/bin:$PATH
          cd dbtap_vita_port_wip/vita && cmake -B build && cmake --build build -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: dbtap_vita_vpk
          path: dbtap_vita_port_wip/vita/build/*.vpk
